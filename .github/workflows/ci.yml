name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Ubuntu 24.04 has glibc 2.39, the oldest glibc the package supports.
    # The job runs directly on the runner, not in a container, so that the
    # tests reach a real journald.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the system packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            appstream clang dbus jq libsensors-dev libsensors5 libwayland-dev \
            libxkbcommon-dev lm-sensors locales pkg-config umockdev
          sudo locale-gen tr_TR.UTF-8 de_DE.UTF-8

      # The desktop entry check needs a validator that knows the desktop
      # category COSMIC, and Ubuntu 24.04 packages an older
      # desktop-file-utils that calls it an error. The job therefore
      # installs the package of Ubuntu 26.04, pinned by its SHA-256. It
      # needs only glibc 2.34 and GLib 2.50, which this release has; dpkg
      # fails the step when a dependency is not met.
      - name: Install desktop-file-utils 0.28
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/desktop-file-utils.deb" \
            https://archive.ubuntu.com/ubuntu/pool/main/d/desktop-file-utils/desktop-file-utils_0.28-1build1_amd64.deb
          echo "4bc2c38ed9722d6ccdc7b27e77852f35363d06b8a8d786856aed4ffea98840b7  $RUNNER_TEMP/desktop-file-utils.deb" | sha256sum --check -
          sudo dpkg --install "$RUNNER_TEMP/desktop-file-utils.deb"

      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustup component add rustfmt clippy
          rustc --version

      - name: Install cargo-deny
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cargo-deny.tar.gz" \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$HOME/.cargo/bin" \
            --strip-components=1 --wildcards '*/cargo-deny'

      # The icon check (tools/c_applet_panel_10.sh) looks names up in the
      # installed COSMIC icon theme, which Ubuntu does not package. The
      # commit is the one that the libcosmic revision in Cargo.toml pins.
      - name: Install the COSMIC icon theme
        run: |
          git init -q "$RUNNER_TEMP/icons"
          cd "$RUNNER_TEMP/icons"
          git fetch -q --depth 1 https://github.com/pop-os/cosmic-icons 343c007f37cd71716e68f01c43ecf2764b7f7c47
          git checkout -q FETCH_HEAD
          sudo mkdir -p /usr/share/icons/Cosmic
          sudo cp -r freedesktop/scalable extra/scalable index.theme /usr/share/icons/Cosmic/

      # Fails here, naming each missing need, before anything is built.
      - name: Check the host
        run: sh tools/check-test-host.sh

      # The cache key covers the toolchain, the system packages whose headers
      # the build binds to, and the lock file, so a restored target directory
      # holds no stale dependency; cargo still rebuilds the workspace crates
      # from the checkout.
      - name: Compute the cache key
        id: host
        run: |
          id=$({ rustc -vV; dpkg-query -W clang libsensors-dev libwayland-dev libxkbcommon-dev; } | sha256sum | cut -d' ' -f1)
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ steps.host.outputs.id }}-${{ hashFiles('Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --all --check

      # make check needs no sensor hardware: the tests run on umockdev
      # testbeds and fixtures, and a test whose host need is missing fails
      # rather than being skipped. The package checks (make check-deb,
      # tools/check-source-archive.sh) are not part of make check and do not
      # run here.
      - name: make check
        run: make check

  flatpak:
    # Builds the Flatpak from this tree, runs the sandbox probe on its
    # build directory, and keeps the bundle. It is
    # a job of this workflow, not a workflow of its own, so that one green
    # run on a release commit covers the Flatpak too. A full build takes
    # long, so a push builds only when it changes a file that goes into
    # the Flatpak or into its build.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A pull request always builds, and so does a push whose previous
      # commit is not in the history (a new branch). Any other push builds
      # when it changes a file that the build reads: the Rust sources
      # under crates/, the translations that the applet embeds, the
      # manifest, the data files, the lock file, the workspace manifest,
      # the changelog that the release notes come from, the Makefile that
      # installs the files, the license texts and the scripts that write
      # the license notices and the source offer, this workflow or a
      # Flatpak script. Without crates/ on the list, a change that breaks
      # the Flatpak build would show only on the release commit. A
      # version commit changes Cargo.lock, so every release commit is
      # built.
      - name: Decide whether to build
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          build=true
          if [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
            if git diff --name-only "$BEFORE" "$SHA" \
                | grep -Eq '^(crates/|data/|flatpak/|i18n/|tools/flatpak-|(Cargo\.lock|Cargo\.toml|CHANGELOG\.md|Makefile|LICENSE|debian/source-offer\.in|tools/gen-notices\.py|tools/lm-sensors-ref\.sh|\.github/workflows/ci\.yml)$)'; then
              build=true
            else
              build=false
            fi
          fi
          echo "build=$build"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      # The same tools and the same remote as the COSMIC Flatpak
      # repository's own CI. The remote is added for the user because the
      # build installs the runtime and the SDK for the user. The
      # recommended packages are installed too: flatpak-builder strips the
      # binaries with eu-strip from elfutils, which is only a
      # recommendation, and the build fails without it.
      - name: Install flatpak-builder
        if: steps.changes.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            flatpak flatpak-builder python3-aiohttp python3-tomlkit
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build the Flatpak
        if: steps.changes.outputs.build == 'true'
        run: PURON_FLATPAK_INSTALL_DEPS=1 PURON_FLATPAK_DIR="$RUNNER_TEMP/flatpak" sh tools/flatpak-build.sh "$RUNNER_TEMP/puron.flatpak"

      # The runner has no desktop session, so the probe runs on the build
      # directory, where the journal and the icon theme lines are skipped.
      - name: Probe the sandbox
        if: steps.changes.outputs.build == 'true'
        run: sh tools/flatpak-probe.sh --build-dir "$RUNNER_TEMP/flatpak/build"

      # The bundle is kept for testing only; a release attaches no Flatpak,
      # because a bundle gets no updates and the store delivers the app.
      - name: Keep the bundle
        if: steps.changes.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: puron-flatpak
          path: ${{ runner.temp }}/puron.flatpak
          retention-days: 14
          if-no-files-found: error
